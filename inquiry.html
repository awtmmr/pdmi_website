<p style="margin: 0; color: #d9f1e9;">最初はカウンセリングから始まります。<br>「何が課題か分からない」<br>「DXが必要かどうか分からない」<br>という段階でのご相談を歓迎します。<br><br>なお、当初8時間（2時間×4回程度）の<br>カウンセリングは無料です。</p>

<dialog id="counseling-dialog" aria-labelledby="counseling-dialog-title" style="max-width: 420px; width: calc(100% - 32px); border: 1px solid #e7d9bd; border-radius: 16px; padding: 28px; background: #fff8e9; color: #273943; font-family: 'Noto Sans JP', sans-serif;">
<form onsubmit="return submitCounselingEmail(event);" style="display: flex; flex-direction: column; gap: 16px;">
<h2 id="counseling-dialog-title" style="margin: 0; color: #102c3b; font-size: 22px;">ご相談先について</h2>
<label for="counseling-client-name">会社名・クライアント名</label>
<input id="counseling-client-name" name="clientName" type="text" required autocomplete="organization" style="box-sizing: border-box; width: 100%; border: 1px solid #64747a; border-radius: 8px; padding: 12px; font: inherit;">
<div style="display: flex; justify-content: flex-end; gap: 10px;">
<button type="button" onclick="document.getElementById('counseling-dialog').close();" style="border: 1px solid #087f80; border-radius: 999px; padding: 10px 18px; background: transparent; color: #087f80; font: inherit; cursor: pointer;">キャンセル</button>
<button type="submit" style="border: 0; border-radius: 999px; padding: 10px 18px; background: #087f80; color: #fffdf7; font: inherit; font-weight: 700; cursor: pointer;">メールを作成</button>
</div>
</form>
</dialog>
<script>
function startCounselingEmail(event) {
  event.preventDefault();
  const dialog = document.getElementById("counseling-dialog");
  dialog.showModal();
  document.getElementById("counseling-client-name").focus();
  return false;
}

function submitCounselingEmail(event) {
  event.preventDefault();
  const trimmedName = document.getElementById("counseling-client-name").value.trim();
  if (!trimmedName) {
    document.getElementById("counseling-client-name").focus();
    return false;
  }

  const subject = encodeURIComponent(`無料カウンセリングのご相談｜${trimmedName}`);
  document.getElementById("counseling-dialog").close();
  window.location.href = `mailto:awtmmr@pdmi.jp?subject=${subject}`;
  return false;
}
</script>
